<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}
* { box-sizing: border-box; }
body {
    font-family: Arial, "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    padding: 16px 16px 32px;
    gap: 16px;
}
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
    overflow: hidden;
}
.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}
#statusInfo {
    font-size: 14px;
    font-weight: bold;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}
.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid #edf2f7;
}
#timeHour, #timeMin, #timeSec {
    font-size: 38px;
    font-weight: normal;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}
.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}
@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}
button:not(:disabled):active { transform: scale(0.97); }
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
    animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: Arial, "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="user-profile-container">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-profile">
                <div id="userInfo">載入中...</div>
                <div class="app-subtitle" id="headerDate">載入日期中...</div>
            </div>
        </div>
        <div id="statusInfo">檢查中...</div>
    </div>
    <div class="dashboard-card">
        <div class="clock-container">
            <div class="time-box"><span id="timeHour">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeMin">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeSec">00</span></div>
        </div>
        <div class="buttons-container">
            <button id="btnStart" disabled>上班</button>
            <button id="btnEnd" disabled>下班</button>
        </div>
    </div>
    <div class="section-container">
        <div class="section-title">📋 今日打卡紀錄</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>
    <button id="btnApprove">查看 | 簽核</button>
</div>

<script>
/* =================================================
 * 系統設定
 * ================================================= */

const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbx3Rgi3ReKI5fqm8Kf7CPQEwBk2S8qjj5a3A3VOQTLHM5k17dKRlguUDrQH0Vj7jG-V1A/exec";
const COMPANY_IPS = ["220.134.112.245", "114.34.60.48"];
const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"];
const LIFF_ID = "2008520938-4018BD8v";

/* =================================================
 * DOM
 * ================================================= */

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const btnApprove = document.getElementById("btnApprove");

/* =================================================
 * 全域狀態
 * ================================================= */

window.userId = "";
window.userName = "";
window.allowRemote = false;
window.userReady = false;
window.currentIP = "";
window.currentRequestId = "";
window.isSubmitting = false;
window.statusUpdating = false;
window.recordsLoading = false;
window.recordsRefreshTimer = null;
window.todayRecordsData = [];
window.processedRequestIds = new Set();

/* =================================================
 * HTML 安全
 * ================================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

/* =================================================
 * 日期時間顯示
 * ================================================= */

function updateDateTime() {
  const now = new Date();
  const hours = String(now.getHours()).padStart(2, "0");
  const minutes = String(now.getMinutes()).padStart(2, "0");
  const seconds = String(now.getSeconds()).padStart(2, "0");

  const hourEl = document.getElementById("timeHour");
  const minEl = document.getElementById("timeMin");
  const secEl = document.getElementById("timeSec");

  if (hourEl) hourEl.textContent = hours;
  if (minEl) minEl.textContent = minutes;
  if (secEl) secEl.textContent = seconds;

  if (headerDate) {
    headerDate.textContent = now.toLocaleDateString("zh-TW", {
      year: "numeric",
      month: "long",
      day: "numeric",
      weekday: "short"
    });
  }
}

updateDateTime();
setInterval(updateDateTime, 1000);

/* =================================================
 * 按鈕鎖定
 * ================================================= */

function setButtonsLock(locked, startText = "上班", endText = "下班") {
  if (!btnStart || !btnEnd) return;

  btnStart.disabled = locked || window.isSubmitting;
  btnEnd.disabled = locked || window.isSubmitting;
  btnStart.textContent = startText;
  btnEnd.textContent = endText;
  window.userReady = !locked && !!window.userId;
}

/* =================================================
 * Request ID
 * ================================================= */

function createRequestId() {
  return "CLK_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
}

/* =================================================
 * 通用 Fetch
 * ================================================= */

async function fetchJson(url, options = {}, timeoutMs = 10000) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const response = await fetch(url, {
      ...options,
      signal: controller.signal,
      cache: "no-store"
    });
    const text = await response.text();

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    if (!text) {
      throw new Error("伺服器沒有回傳資料");
    }

    try {
      return JSON.parse(text);
    } catch (error) {
      throw new Error("伺服器回傳格式錯誤");
    }
  } catch (error) {
    if (error.name === "AbortError") {
      const timeoutError = new Error("REQUEST_TIMEOUT");
      timeoutError.code = "REQUEST_TIMEOUT";
      throw timeoutError;
    }
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

/* =================================================
 * 公司 IP
 * ================================================= */

function isCompanyIP(ip) {
  return COMPANY_IPS.includes(String(ip || "").trim());
}

/* =================================================
 * IP 取得
 * ================================================= */

let ipPromise = null;

async function preloadIP(forceRefresh = false) {
  if (window.currentIP && !forceRefresh) return window.currentIP;

  const cached = sessionStorage.getItem("myIP");
  if (cached && !forceRefresh) {
    window.currentIP = cached;
    return cached;
  }
  if (ipPromise && !forceRefresh) return ipPromise;

  ipPromise = (async () => {
    try {
      const result = await fetchJson("https://api.ipify.org?format=json", {}, 3000);
      const ip = String(result.ip || "").trim();
      if (ip) {
        window.currentIP = ip;
        sessionStorage.setItem("myIP", ip);
      }
      return ip;
    } catch (error) {
      return window.currentIP || cached || "";
    } finally {
      ipPromise = null;
    }
  })();

  return ipPromise;
}

/* =================================================
 * 本機快取使用者
 * ================================================= */

function loadUserFromCache() {
  const cachedUserId = localStorage.getItem("cached_userId");
  const cachedUserName = localStorage.getItem("cached_userName");
  const cachedPictureUrl = localStorage.getItem("cached_pictureUrl");

  if (cachedUserId) {
    window.userId = cachedUserId;
    window.userName = cachedUserName || "使用者";

    if (userInfo) {
      userInfo.textContent = `${window.userName} 您好`;
    }

    if (cachedPictureUrl && userAvatar) {
      userAvatar.innerHTML = `<img src="${escapeHtml(cachedPictureUrl)}" alt="avatar" style="width:100%;height:100%;object-fit:cover;">`;
    } else if (userAvatar) {
      userAvatar.textContent = window.userName.charAt(0) || "👤";
    }

    if (MANAGERS.includes(window.userId) && btnApprove) {
      btnApprove.style.display = "block";
    }
  }

  const cachedRecords = sessionStorage.getItem("cached_today_records");
  if (cachedRecords) {
    try {
      const records = JSON.parse(cachedRecords);
      if (Array.isArray(records)) {
        window.todayRecordsData = records;
        renderRecords(records);
      }
    } catch (error) {
      console.warn("今日紀錄快取解析失敗", error);
    }
  }
}

/* =================================================
 * LIFF
 * ================================================= */

async function initUser() {
  await liff.init({ liffId: LIFF_ID });

  if (!liff.isLoggedIn()) {
    liff.login();
    return false;
  }

  const profile = await liff.getProfile();
  window.userId = String(profile.userId || "").trim();
  window.userName = profile.displayName || "使用者";

  if (userInfo) {
    userInfo.textContent = `${window.userName} 您好`;
  }

  if (profile.pictureUrl && userAvatar) {
    userAvatar.innerHTML = `<img src="${escapeHtml(profile.pictureUrl)}" alt="avatar" style="width:100%;height:100%;object-fit:cover;">`;
    localStorage.setItem("cached_pictureUrl", profile.pictureUrl);
  } else if (userAvatar) {
    userAvatar.textContent = window.userName.charAt(0) || "👤";
  }

  localStorage.setItem("cached_userId", window.userId);
  localStorage.setItem("cached_userName", window.userName);

  if (btnApprove) {
    btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
  }

  return true;
}

/* =================================================
 * 更新打卡區域
 * ================================================= */

async function updateStatus() {
  if (window.statusUpdating) return;
  window.statusUpdating = true;

  try {
    const ip = await preloadIP();

    if (isCompanyIP(ip)) {
      window.allowRemote = false;
      if (statusInfo) {
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
      }
      setButtonsLock(false, "上班", "下班");
      return;
    }

    if (!window.userId) {
      if (statusInfo) {
        statusInfo.textContent = "等待 LINE 使用者資訊";
        statusInfo.style.background = "#95a5a6";
      }
      setButtonsLock(true, "上班", "下班");
      return;
    }

    try {
      const result = await fetchJson(
        `${API_ENDPOINT}?action=checkRemote&userId=${encodeURIComponent(window.userId)}&_=${Date.now()}`,
        {},
        5000
      );
      window.allowRemote = result.allowed === true;
    } catch (error) {
      console.warn("異地權限檢查失敗:", error);
      window.allowRemote = false;
    }

    if (window.allowRemote) {
      if (statusInfo) {
        statusInfo.textContent = "有效打卡區（異地）";
        statusInfo.style.background = "#2ecc71";
      }
      setButtonsLock(false, "上班", "下班");
    } else {
      if (statusInfo) {
        statusInfo.textContent = "無效打卡區";
        statusInfo.style.background = "#e74c3c";
      }
      setButtonsLock(true, "上班", "下班");
    }
  } finally {
    window.statusUpdating = false;
  }
}

/* =================================================
 * GPS
 * ================================================= */

function getGeoLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) {
      resolve({ lat: "", lng: "" });
      return;
    }

    navigator.geolocation.getCurrentPosition(
      position => {
        resolve({
          lat: position.coords.latitude,
          lng: position.coords.longitude
        });
      },
      error => {
        console.warn("GPS 取得失敗:", error);
        resolve({ lat: "", lng: "" });
      },
      {
        timeout: 6000,
        enableHighAccuracy: true,
        maximumAge: 30000
      }
    );
  });
}

/* =================================================
 * 今日日期
 * ================================================= */

function getTodayString() {
  const now = new Date();
  return `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")}`;
}

/* =================================================
 * 時間格式
 * ================================================= */

function fixTimeFormat(value) {
  if (value === null || value === undefined || value === "") {
    return "00:00:00";
  }
  if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
    const parts = value.split(":");
    while (parts.length < 3) {
      parts.push("00");
    }
    return parts.slice(0, 3).map(v => String(v).padStart(2, "0")).join(":");
  }
  if (typeof value === "string" && value.includes("T")) {
    const d = new Date(value);
    if (!isNaN(d.getTime())) {
      return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
  }
  if (typeof value === "number") {
    const d = new Date((value - 25569) * 86400 * 1000);
    if (!isNaN(d.getTime())) {
      return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
  }
  return String(value);
}

/* =================================================
 * 打卡 Loading
 * ================================================= */

function showClockLoading(titleText, subText = "正在確認打卡資料，請稍候...") {
  Swal.fire({
    html: `
      <div style="padding:15px 0; text-align:center;">
        <div class="clock-loading-spinner"></div>
        <h3 style="margin:0 0 8px 0; color:#2c3e50; font-size:20px; font-weight:bold;">${escapeHtml(titleText)}</h3>
        <p style="margin:0; color:#7f8c8d; font-size:14px;">${escapeHtml(subText)}</p>
      </div>
    `,
    showConfirmButton: false,
    allowOutsideClick: false,
    allowEscapeKey: false,
    backdrop: "rgba(0,0,0,0.5)",
    customClass: { popup: "custom-swal-popup" }
  });
}

/* =================================================
 * Render 今日紀錄
 * ================================================= */

function renderRecords(data) {
  if (!Array.isArray(data)) data = [];
  window.todayRecordsData = data;

  if (!todayRecords) return;

  if (data.length === 0) {
    todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
    return;
  }

  todayRecords.innerHTML = data.map(record => {
    const status = record.status === "下班" ? "下班" : "上班";
    const color = status === "下班" ? "#2ecc71" : "#3498db";
    const time = fixTimeFormat(record.time);
    const isCompany = isCompanyIP(record.ip);
    const networkLabel = isCompany ? "公司網路" : "異地打卡";
    const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
    const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

    return `
      <div class="record-item" style="border-left-color:${color};">
        <div class="record-info">
          <div class="record-status">${escapeHtml(status)}${makeupBadge}</div>
          <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
        </div>
        <div class="record-time" style="color:${color};">${escapeHtml(time)}</div>
      </div>
    `;
  }).join("");
}

/* =================================================
 * 儲存今日紀錄
 * ================================================= */

function saveTodayRecords(data) {
  if (!Array.isArray(data)) return;
  window.todayRecordsData = data;
  try {
    sessionStorage.setItem("cached_today_records", JSON.stringify(data));
  } catch (error) {
    console.warn("今日紀錄快取失敗:", error);
  }
}

/* =================================================
 * 讀取今日紀錄
 * ================================================= */

async function updateTodayRecords(options = {}) {
  const silent = options.silent !== false;
  const timeoutMs = options.timeoutMs || 6000;

  if (!window.userId) return false;
  if (window.recordsLoading) return false;

  window.recordsLoading = true;

  try {
    const date = getTodayString();
    const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}&_=${Date.now()}`;
    const result = await fetchJson(url, {}, timeoutMs);
    const data = Array.isArray(result) ? result : (Array.isArray(result.data) ? result.data : []);

    saveTodayRecords(data);
    renderRecords(data);
    return true;
  } catch (error) {
    console.warn("今日紀錄背景同步失敗:", error);
    if (!silent && (!window.todayRecordsData || window.todayRecordsData.length === 0)) {
      todayRecords.innerHTML = `<div class="records-empty" style="color:#e67e22;">今日紀錄同步中...</div>`;
    }
    return false;
  } finally {
    window.recordsLoading = false;
  }
}

/* =================================================
 * 背景同步
 * ================================================= */

function backgroundRefreshRecords(delay = 500) {
  clearTimeout(window.recordsRefreshTimer);
  window.recordsRefreshTimer = setTimeout(() => {
    updateTodayRecords({ silent: true, timeoutMs: 7000 }).catch(() => {});
  }, delay);
}

/* =================================================
 * 前端立即加入紀錄
 * ================================================= */

function optimisticAddRecord(record) {
  if (!record) return;

  const requestId = String(record.requestId || "").trim();
  if (requestId && window.processedRequestIds.has(requestId)) return;
  if (requestId) window.processedRequestIds.add(requestId);

  let data = Array.isArray(window.todayRecordsData) ? [...window.todayRecordsData] : [];

  if (requestId && data.some(item => String(item.requestId || "").trim() === requestId)) {
    return;
  }

  if (record.status === "下班" && !record.isMakeup) {
    let targetIndex = -1;
    for (let i = data.length - 1; i >= 0; i--) {
      if (data[i].status === "上班" && !data[i].isMakeup) {
        targetIndex = i;
        break;
      }
    }

    if (targetIndex >= 0) {
      data[targetIndex] = {
        ...data[targetIndex],
        status: "下班",
        time: record.time,
        date: record.date,
        ip: record.ip,
        requestId: record.requestId
      };
    } else {
      data.push(record);
    }
  } else {
    data.push(record);
  }

  data.sort((a, b) => {
    const ta = fixTimeFormat(a.time);
    const tb = fixTimeFormat(b.time);
    return ta.localeCompare(tb);
  });

  saveTodayRecords(data);
  renderRecords(data);
}

/* =================================================
 * POST 打卡
 * ================================================= */

async function submitClock(payload) {
  return await fetchJson(
    API_ENDPOINT,
    {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    },
    15000
  );
}

/* =================================================
 * LINE 自己傳通知
 * ================================================= */

async function sendSelfMessage(record) {
  try {
    if (!window.liff || !liff.isInClient()) return;

    const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";

    await liff.sendMessages([
      {
        type: "flex",
        altText: `【打卡通知】${record.status}成功`,
        contents: {
          type: "bubble",
          header: {
            type: "box",
            layout: "vertical",
            contents: [
              { type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }
            ],
            backgroundColor: headerColor,
            paddingAll: "12px"
          },
          body: {
            type: "box",
            layout: "vertical",
            spacing: "md",
            contents: [
              { type: "text", text: `狀態：${record.status}`, size: "md" },
              { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
              { type: "text", text: `網路：${record.netType}`, size: "md" }
            ]
          }
        }
      }
    ]);
  } catch (error) {
    console.warn("LINE 訊息傳送失敗:", error);
  }
}

/* =================================================
 * 打卡成功畫面
 * ================================================= */

async function showClockResult(apiData, status, isMakeup) {
  await Swal.fire({
    icon: "success",
    title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
    html: `
      <div style="font-size:16px; margin-top:8px;">
        <strong>打卡時間：</strong>
        <br>
        <span style="color:#2980b9; font-size:18px; font-weight:bold;">
          ${escapeHtml(apiData.date || "")} ${escapeHtml(apiData.time || "")}
        </span>
      </div>
    `,
    showConfirmButton: false,
    timer: 1400,
    timerProgressBar: true,
    backdrop: "rgba(0,0,0,0.5)",
    customClass: { popup: "custom-swal-popup" }
  });
}

/* =================================================
 * 核心打卡函式
 * ================================================= */

async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
  if (window.isSubmitting) return;

  if (!window.userId) {
    await Swal.fire({
      icon: "warning",
      title: "提示",
      text: "尚未取得 LINE 使用者資訊，請稍候再試。",
      confirmButtonText: "確定",
      customClass: { popup: "custom-swal-popup" }
    });
    return;
  }

  if (!window.userReady && !isMakeup) {
    await Swal.fire({
      icon: "warning",
      title: "目前無法打卡",
      text: "目前為無效打卡區，無法打卡！",
      confirmButtonText: "確定",
      customClass: { popup: "custom-swal-popup" }
    });
    return;
  }

  window.isSubmitting = true;
  window.currentRequestId = createRequestId();
  const requestId = window.currentRequestId;

  setButtonsLock(true, "處理中...", "處理中...");
  showClockLoading(
    isMakeup ? "補打卡中" : (status === "上班" ? "上班打卡中" : "下班打卡中"),
    "正在送出打卡資料..."
  );

  try {
    const ip = await preloadIP();
    const isCompany = isCompanyIP(ip);

    if (!isMakeup && !isCompany && !window.allowRemote) {
      throw new Error("非公司網路且未授權異地打卡！");
    }

    let lat = "";
    let lng = "";
    if (!isMakeup && !isCompany && window.allowRemote) {
      const geo = await getGeoLocation();
      lat = geo.lat;
      lng = geo.lng;
    }

    const payload = {
      userId: window.userId,
      displayName: window.userName,
      status: status,
      ip: ip,
      lat: lat,
      lng: lng,
      customDate: customDate,
      customTime: customTime,
      isMakeup: isMakeup,
      requestId: requestId
    };

    let apiData;
    try {
      apiData = await submitClock(payload);
    } catch (postError) {
      if (
        postError.code === "REQUEST_TIMEOUT" ||
        postError.message === "Failed to fetch" ||
        postError.name === "TypeError"
      ) {
        Swal.close();
        await Swal.fire({
          icon: "info",
          title: "打卡請求已送出",
          html: `
            <div style="font-size:15px; line-height:1.8;">
              伺服器回應較慢。<br>
              系統可能已完成打卡。<br>
              <strong>請勿重複按打卡。</strong>
            </div>
          `,
          confirmButtonText: "知道了",
          customClass: { popup: "custom-swal-popup" }
        });
        backgroundRefreshRecords(1000);
        return;
      }
      throw postError;
    }

    if (!apiData || apiData.success !== true) {
      throw new Error(apiData?.message || "打卡失敗，請稍後再試");
    }

    const localRecord = {
      status: status,
      time: apiData.time || (customTime ? fixTimeFormat(customTime) : fixTimeFormat(new Date().toLocaleTimeString("zh-TW", { hour12: false }))),
      date: apiData.date || customDate || getTodayString(),
      ip: ip,
      requestId: apiData.requestId || requestId,
      isMakeup: isMakeup,
      userName: window.userName
    };

    optimisticAddRecord(localRecord);
    Swal.close();
    await showClockResult(apiData, status, isMakeup);

    sendSelfMessage({
      userName: window.userName,
      status: status,
      date: localRecord.date,
      time: localRecord.time,
      netType: isCompany ? "公司網路" : "異地打卡(GPS)"
    }).catch(() => {});

    backgroundRefreshRecords(1200);
  } catch (error) {
    console.error("performClockIn error:", error);
    Swal.close();
    await Swal.fire({
      icon: "error",
      title: "打卡失敗",
      html: `<div style="color:#c0392b; font-weight:bold; line-height:1.7;">${escapeHtml(error.message || "網路連線異常")}</div>`,
      confirmButtonText: "確定",
      customClass: { popup: "custom-swal-popup" }
    });
    backgroundRefreshRecords(500);
  } finally {
    window.isSubmitting = false;
    updateStatus().catch(error => {
      console.warn("更新打卡區域失敗:", error);
    });
  }
}

/* =================================================
 * 事件綁定
 * ================================================= */

if (btnStart) {
  btnStart.addEventListener("click", () => performClockIn("上班"));
}

if (btnEnd) {
  btnEnd.addEventListener("click", () => performClockIn("下班"));
}

if (btnApprove) {
  btnApprove.addEventListener("click", () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
  });
}

/* =================================================
 * 初始化
 * ================================================= */

window.addEventListener("load", async () => {
  if (statusInfo) {
    statusInfo.textContent = "檢查中...";
    statusInfo.style.background = "#95a5a6";
  }

  setButtonsLock(true, "同步中...", "同步中...");
  loadUserFromCache();
  preloadIP().catch(() => {});

  try {
    const loginOK = await initUser();
    if (!loginOK) {
      if (statusInfo) {
        statusInfo.textContent = "請完成 LINE 登入";
        statusInfo.style.background = "#95a5a6";
      }
      setButtonsLock(true, "上班", "下班");
      return;
    }

    updateStatus().catch(error => {
      console.warn("初始化打卡區域失敗:", error);
    });

    updateTodayRecords({ silent: true, timeoutMs: 7000 }).catch(error => {
      console.warn("初始化今日紀錄失敗:", error);
    });
  } catch (error) {
    console.error("初始化失敗:", error);
    if (statusInfo) {
      statusInfo.textContent = "初始化失敗，請重新整理";
      statusInfo.style.background = "#e74c3c";
    }
    setButtonsLock(true, "重新整理", "重新整理");
  }
});

/* =================================================
 * 視窗可見性與定時同步
 * ================================================= */

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && window.userId) {
    backgroundRefreshRecords(500);
    updateStatus().catch(() => {});
  }
});

setInterval(() => {
  if (document.visibilityState === "visible" && window.userId && !window.isSubmitting) {
    updateTodayRecords({ silent: true, timeoutMs: 7000 }).catch(() => {});
  }
}, 60000);
</script>
