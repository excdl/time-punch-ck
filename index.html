<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}
* { box-sizing: border-box; }
body {
    font-family: Arial, "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    padding: 16px 16px 32px;
    gap: 16px;
}
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
    overflow: hidden;
}
.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 220px;
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}
#statusInfo {
    font-size: 14px;
    font-weight: bold;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}
.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid #edf2f7;
}
#timeHour, #timeMin, #timeSec {
    font-size: 38px;
    font-weight: normal;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}
.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}
@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}
button:not(:disabled):active { transform: scale(0.97); }
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
    animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: Arial, "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3) !important;
}
</style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="user-profile-container">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-profile">
                <div id="userInfo">載入中...</div>
                <div class="app-subtitle" id="headerDate">載入日期中...</div>
            </div>
        </div>
        <div id="statusInfo">檢查中...</div>
    </div>
    <div class="dashboard-card">
        <div class="clock-container">
            <div class="time-box"><span id="timeHour">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeMin">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeSec">00</span></div>
        </div>
        <div class="buttons-container">
            <button id="btnStart" disabled>上班</button>
            <button id="btnEnd" disabled>下班</button>
        </div>
    </div>
    <div class="section-container">
        <div class="section-title">📋 今日打卡紀錄</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>
    <button id="btnApprove">查看 | 簽核</button>
</div>

<script>
/*************************************************
 * 智能打卡系統 - 前端 V4 (修正版)
 *************************************************/

const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzW0zsEpM2zIhD6ZRHsV9FK-vIAIWMdq7T0NWjvfNUnW8J4LG8TkcTprcRN8uAujQyiPw/exec";
const COMPANY_IPS = ["220.134.112.245", "114.34.60.48"];
const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"];
const LIFF_ID = "2008520938-4018BD8v";

const userInfo = document.getElementById("userInfo");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const userAvatar = document.getElementById("userAvatar");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const btnApprove = document.getElementById("btnApprove");

// 時鐘數字顯示元素
const timeHour = document.getElementById("timeHour");
const timeMin = document.getElementById("timeMin");
const timeSec = document.getElementById("timeSec");

window.userId = "";
window.userName = "";
window.allowRemote = false;
window.userReady = false;
window.isSubmitting = false;
window.currentIP = "";
window.currentRequestId = "";
window.statusUpdating = false;
window.todayRecordsPromise = null;
window.recordsRequestVersion = 0;
window.lastRecordsFetchTime = 0;
window.lastRecordsDate = "";
window.remoteStatusCacheTime = 0;
window.initialized = false;

const RECORD_CACHE_TTL = 60 * 1000;
const RECORD_FETCH_TIMEOUT = 12000;
const RECORD_MAX_RETRY = 3;
const REMOTE_STATUS_TTL = 60 * 1000;

function updateClockAndDate() {
  const now = new Date();
  if (headerDate) {
    headerDate.textContent = now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' });
  }
  if (timeHour && timeMin && timeSec) {
    timeHour.textContent = String(now.getHours()).padStart(2, "0");
    timeMin.textContent = String(now.getMinutes()).padStart(2, "0");
    timeSec.textContent = String(now.getSeconds()).padStart(2, "0");
  }
}
updateClockAndDate();
setInterval(updateClockAndDate, 1000);

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function createRequestId() {
  return "CLK_" + Date.now() + "_" + Math.random().toString(36).slice(2, 10);
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getTodayString() {
  const d = new Date();
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
}

function setButtonsLock(locked, startText = "上班", endText = "下班") {
  btnStart.disabled = locked || window.isSubmitting;
  btnEnd.disabled = locked || window.isSubmitting;
  btnStart.textContent = startText;
  btnEnd.textContent = endText;
  window.userReady = !locked;
}

async function preloadIP() {
  if (window.currentIP) return window.currentIP;
  const cached = sessionStorage.getItem("myIP");
  if (cached) { window.currentIP = cached; return cached; }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 4000);
  try {
    const response = await fetch("https://api.ipify.org?format=json", { signal: controller.signal, cache: "no-store" });
    if (!response.ok) throw new Error("IP API error");
    const data = await response.json();
    const ip = String(data.ip || "").trim();
    if (ip) { window.currentIP = ip; sessionStorage.setItem("myIP", ip); }
    return ip;
  } catch (error) {
    return "";
  } finally {
    clearTimeout(timeout);
  }
}

function loadUserFromCache() {
  const cachedUserId = localStorage.getItem("cached_userId");
  const cachedUserName = localStorage.getItem("cached_userName");
  const cachedPictureUrl = localStorage.getItem("cached_pictureUrl");
  if (cachedUserId) {
    window.userId = cachedUserId;
    window.userName = cachedUserName || "使用者";
    if (userInfo) userInfo.textContent = `${window.userName} 您好`;
    if (cachedPictureUrl && userAvatar) {
      userAvatar.innerHTML = `<img src="${escapeHtml(cachedPictureUrl)}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
    }
  }
}

function getTodayCacheKey() {
  if (!window.userId) return "";
  const today = getTodayString().replace(/\//g, "");
  return `cached_today_records_${window.userId}_${today}`;
}

function getTodayCache() {
  const key = getTodayCacheKey();
  if (!key) return null;
  try {
    const raw = sessionStorage.getItem(key);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj || !Array.isArray(obj.data)) return null;
    if (obj.date !== getTodayString() || Date.now() - Number(obj.timestamp || 0) > 24 * 60 * 60 * 1000) {
      sessionStorage.removeItem(key);
      return null;
    }
    return obj.data;
  } catch (error) {
    return null;
  }
}

function setTodayCache(data) {
  const key = getTodayCacheKey();
  if (!key) return;
  try {
    sessionStorage.setItem(key, JSON.stringify({
      date: getTodayString(),
      timestamp: Date.now(),
      data: Array.isArray(data) ? data : []
    }));
  } catch (error) {}
}

function clearOldRecordCaches() {
  if (!window.userId) return;
  try {
    const today = getTodayString().replace(/\//g, "");
    const prefix = `cached_today_records_${window.userId}_`;
    for (let i = sessionStorage.length - 1; i >= 0; i--) {
      const key = sessionStorage.key(i);
      if (key && key.startsWith(prefix) && !key.endsWith(today)) {
        sessionStorage.removeItem(key);
      }
    }
  } catch (error) {}
}

async function fetchJson(url, options = {}, timeoutMs = 12000) {
  const controller = new AbortController();
  let timeout = null;
  try {
    timeout = setTimeout(() => controller.abort(), timeoutMs);
    const response = await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
    const text = await response.text();
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    if (!text) throw new Error("伺服器沒有回傳資料");
    return JSON.parse(text);
  } catch (error) {
    if (error.name === "AbortError") {
      const timeoutError = new Error("REQUEST_TIMEOUT");
      timeoutError.code = "REQUEST_TIMEOUT";
      throw timeoutError;
    }
    throw error;
  } finally {
    if (timeout) clearTimeout(timeout);
  }
}

async function initUser() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
        liff.login();
        return false;
    }

    const profile = await liff.getProfile();
    window.userId = String(profile.userId || "").trim();
    window.userName = profile.displayName || "使用者";
    if (userInfo) userInfo.textContent = `${window.userName} 您好`;

    if (profile.pictureUrl && userAvatar) {
        userAvatar.innerHTML = `<img src="${escapeHtml(profile.pictureUrl)}" alt="avatar" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
        localStorage.setItem("cached_pictureUrl", profile.pictureUrl);
    } else if (userAvatar) {
        userAvatar.textContent = window.userName.charAt(0) || "👤";
    }

    localStorage.setItem("cached_userId", window.userId);
    localStorage.setItem("cached_userName", window.userName);
    if (btnApprove) {
      btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
    }
    return true;
}

function showCompanyStatus() {
  window.allowRemote = false;
  statusInfo.textContent = "有效打卡區";
  statusInfo.style.background = "#2ecc71";
  setButtonsLock(false, "上班", "下班");
}

function showRemoteStatus() {
  statusInfo.textContent = "有效打卡區（異地）";
  statusInfo.style.background = "#2ecc71";
  setButtonsLock(false, "上班", "下班");
}

function showInvalidStatus() {
  statusInfo.textContent = "無效打卡區";
  statusInfo.style.background = "#e74c3c";
  setButtonsLock(true, "上班", "下班");
}

function showWaitingStatus() {
  statusInfo.textContent = "等待 LINE 使用者資訊";
  statusInfo.style.background = "#95a5a6";
  setButtonsLock(true, "上班", "下班");
}

async function bootstrap() {
  if (!window.userId) { showWaitingStatus(); return; }
  const ip = await preloadIP();
  if (COMPANY_IPS.includes(ip)) {
    showCompanyStatus();
    updateTodayRecords().catch(() => {});
    return;
  }

  try {
    const url = `${API_ENDPOINT}?action=bootstrap&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(getTodayString())}&v=${Date.now()}`;
    const result = await fetchJson(url, {}, 12000);
    if (result && result.success === true) {
      window.allowRemote = result.allowed === true;
      window.remoteStatusCacheTime = Date.now();
      const data = Array.isArray(result.data) ? result.data : [];
      setTodayCache(data);
      renderRecords(data);
      window.lastRecordsFetchTime = Date.now();
      window.lastRecordsDate = getTodayString();
      window.allowRemote ? showRemoteStatus() : showInvalidStatus();
      return;
    }
    throw new Error(result?.message || "Bootstrap failed");
  } catch (error) {
    const cached = getTodayCache();
    if (cached) renderRecords(cached);
    await updateStatus(true);
    updateTodayRecords(true).catch(() => {});
  }
}

async function updateStatus(force = false) {
  if (window.statusUpdating) return;
  if (!force && window.remoteStatusCacheTime && Date.now() - window.remoteStatusCacheTime < REMOTE_STATUS_TTL) return;
  window.statusUpdating = true;
  try {
    const ip = await preloadIP();
    if (COMPANY_IPS.includes(ip)) { showCompanyStatus(); return; }
    if (!window.userId) { showWaitingStatus(); return; }

    try {
      const url = `${API_ENDPOINT}?action=checkRemote&userId=${encodeURIComponent(window.userId)}&v=${Date.now()}`;
      const result = await fetchJson(url, {}, 8000);
      window.allowRemote = result.allowed === true;
      window.remoteStatusCacheTime = Date.now();
    } catch (error) {
      if (!window.remoteStatusCacheTime) window.allowRemote = false;
    }
    window.allowRemote ? showRemoteStatus() : showInvalidStatus();
  } finally {
    window.statusUpdating = false;
  }
}

async function updateTodayRecords(force = false) {
  if (!window.userId) return [];
  if (window.todayRecordsPromise && !force) return window.todayRecordsPromise;

  clearOldRecordCaches();
  const today = getTodayString();
  const cached = getTodayCache();

  if (cached) {
    renderRecords(cached);
  } else if (!todayRecords.innerHTML.trim()) {
    todayRecords.innerHTML = `<div class="records-empty">今日紀錄讀取中...</div>`;
  }

  if (!force && cached && window.lastRecordsDate === today && Date.now() - window.lastRecordsFetchTime < RECORD_CACHE_TTL) {
    return cached;
  }

  const requestVersion = ++window.recordsRequestVersion;
  window.todayRecordsPromise = (async () => {
    let lastError = null;
    for (let attempt = 1; attempt <= RECORD_MAX_RETRY; attempt++) {
      try {
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(today)}&fresh=${force ? "1" : "0"}&v=${Date.now()}`;
        const result = await fetchJson(url, {}, RECORD_FETCH_TIMEOUT);
        if (requestVersion !== window.recordsRequestVersion) return [];

        const data = Array.isArray(result) ? result : (Array.isArray(result.data) ? result.data : []);
        setTodayCache(data);
        window.lastRecordsFetchTime = Date.now();
        window.lastRecordsDate = today;
        renderRecords(data);
        return data;
      } catch (error) {
        lastError = error;
        if (attempt < RECORD_MAX_RETRY) {
          await sleep(attempt === 1 ? 600 : attempt === 2 ? 1500 : 3000);
        }
      }
    }

    if (cached && Array.isArray(cached)) {
      renderRecords(cached);
      return cached;
    }

    todayRecords.innerHTML = `<div class="records-empty" style="color:#e67e22;">今日紀錄暫時無法取得<br><small>請稍後重新整理，打卡資料不受影響</small></div>`;
    return [];
  })();

  try {
    return await window.todayRecordsPromise;
  } finally {
    window.todayRecordsPromise = null;
  }
}

function fixTimeFormat(value) {
  if (!value) return "00:00:00";
  if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
    const parts = value.split(":");
    while (parts.length < 3) parts.push("00");
    return parts.slice(0, 3).map(v => String(v).padStart(2, "0")).join(":");
  }
  if (typeof value === "string" && value.includes("T")) {
    const d = new Date(value);
    if (!isNaN(d)) return d.toLocaleTimeString("zh-TW", { hour12: false });
  }
  return String(value);
}

function renderRecords(data) {
  if (!Array.isArray(data) || data.length === 0) {
    todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
    return;
  }
  const sorted = [...data].sort((a, b) => String(a.time || "").localeCompare(String(b.time || "")));
  todayRecords.innerHTML = sorted.map(record => {
    const status = record.status === "下班" ? "下班" : "上班";
    const color = status === "下班" ? "#2ecc71" : "#3498db";
    const time = fixTimeFormat(record.time);
    const isCompany = COMPANY_IPS.includes(String(record.ip || "").trim());
    const networkLabel = isCompany ? "公司網路" : "異地打卡";
    const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
    const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

    return `
      <div class="record-item" style="border-left-color:${color};">
        <div class="record-info">
          <div class="record-status">${status} ${makeupBadge}</div>
          <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
        </div>
        <div class="record-time" style="color:${color};">${time}</div>
      </div>
    `;
  }).join("");
}

function getGeoLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) { resolve({ lat: "", lng: "" }); return; }
    navigator.geolocation.getCurrentPosition(
      position => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
      () => resolve({ lat: "", lng: "" }),
      { timeout: 6000, enableHighAccuracy: true, maximumAge: 30000 }
    );
  });
}

async function confirmClockRecord(requestId, status, maxWaitMs = 12000) {
  const startedAt = Date.now();
  const delays = [800, 1800, 3500];

  for (let i = 0; i < delays.length; i++) {
    if (Date.now() - startedAt >= maxWaitMs) break;
    await sleep(delays[i]);
    try {
      const url = `${API_ENDPOINT}?action=findRequest&userId=${encodeURIComponent(window.userId)}&requestId=${encodeURIComponent(requestId)}&v=${Date.now()}`;
      const result = await fetchJson(url, {}, 7000);
      if (result && result.success === true && result.found === true && result.record) {
        const record = result.record;
        setTodayCache(Array.isArray(result.data) ? result.data : []);
        if (Array.isArray(result.data)) renderRecords(result.data);
        return { success: true, date: record.date || getTodayString(), time: record.time || "", record };
      }
    } catch (error) {}
  }
  return { success: false };
}

async function sendSelfMessage(record) {
  try {
    if (!window.liff || !liff.isInClient()) return;
    const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";
    await liff.sendMessages([{
      type: "flex",
      altText: `【打卡通知】${record.status}成功`,
      contents: {
        type: "bubble",
        header: {
          type: "box", layout: "vertical",
          contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
          backgroundColor: headerColor, paddingAll: "12px"
        },
        body: {
          type: "box", layout: "vertical", spacing: "md",
          contents: [
            { type: "text", text: `狀態：${record.status}`, size: "md" },
            { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
            { type: "text", text: `網路：${record.netType}`, size: "md" }
          ]
        }
      }
    }]);
  } catch (error) {}
}

function showClockResult(apiData, status, isMakeup) {
  Swal.fire({
    icon: "success",
    title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
    html: `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${escapeHtml(apiData.date || "")} ${escapeHtml(apiData.time || "")}</span></div>`,
    showConfirmButton: false,
    timer: 1800,
    timerProgressBar: true,
    backdrop: "rgba(0,0,0,0.5)",
    customClass: { popup: "custom-swal-popup" }
  });
}

async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
  if (window.isSubmitting) return;
  if (!window.userId) {
    Swal.fire({ icon: "warning", title: "提示", text: "尚未取得 LINE 使用者資訊，請稍候再試。", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
    return;
  }
  if (!window.userReady && !isMakeup) {
    Swal.fire({ icon: "warning", title: "目前無法打卡", text: "目前為無效打卡區，無法打卡！", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
    return;
  }

  window.isSubmitting = true;
  window.currentRequestId = createRequestId();
  const requestId = window.currentRequestId;

  setButtonsLock(true, "打卡中...", "打卡中...");

  try {
    const ip = await preloadIP();
    const isCompany = COMPANY_IPS.includes(ip);
    if (!isMakeup && !isCompany && !window.allowRemote) throw new Error("非公司網路且未授權異地打卡！");

    let lat = "", lng = "";
    if (!isMakeup && !isCompany && window.allowRemote) {
      const geo = await getGeoLocation();
      lat = geo.lat;
      lng = geo.lng;
    }

    const payload = { userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup, requestId };
    let apiData;

    try {
      apiData = await fetchJson(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }, 20000);
    } catch (postError) {
      if (postError.code === "REQUEST_TIMEOUT" || postError.message === "Failed to fetch" || postError.name === "TypeError") {
        const confirmed = await confirmClockRecord(requestId, status, 12000);
        if (confirmed.success) {
          apiData = { success: true, date: confirmed.date, time: confirmed.time, message: "打卡成功", requestId };
        } else {
          throw new Error("伺服器回應逾時，目前尚未確認到打卡紀錄。請勿重複按打卡，稍後重新整理即可確認。");
        }
      } else {
        throw postError;
      }
    }

    if (!apiData || apiData.success !== true) throw new Error(apiData?.message || "打卡失敗，請稍後再試");

    showClockResult(apiData, status, isMakeup);

    sendSelfMessage({
      userName: window.userName, status, date: apiData.date, time: apiData.time,
      netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
    }).catch(() => {});

    setTimeout(() => {
      updateTodayRecords(true).catch(error => console.warn("背景同步今日紀錄失敗:", error));
    }, 800);

  } catch (error) {
    Swal.fire({
      icon: "error", title: "打卡失敗",
      html: `<div style="color:#c0392b;font-weight:bold;line-height:1.7;">${escapeHtml(error.message || "網路連線異常")}</div>`,
      confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" }
    });
  } finally {
    window.isSubmitting = false;
    updateStatus().catch(() => {});
    setButtonsLock(false, "上班", "下班");
  }
}

btnStart.onclick = () => performClockIn("上班");
btnEnd.onclick = () => performClockIn("下班");
btnApprove.onclick = () => {
  window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

window.addEventListener("load", async () => {
  statusInfo.textContent = "系統初始化中...";
  statusInfo.style.background = "#95a5a6";
  setButtonsLock(true, "同步中...", "同步中...");

  loadUserFromCache();
  preloadIP().catch(() => {});

  try {
    const results = await Promise.allSettled([initUser(), preloadIP()]);
    if (results[0].status === "rejected") throw results[0].reason;

    if (!window.userId) {
      statusInfo.textContent = "請完成 LINE 登入";
      statusInfo.style.background = "#95a5a6";
      return;
    }

    clearOldRecordCaches();
    const cached = getTodayCache();
    if (cached) renderRecords(cached);

    await bootstrap();
    window.initialized = true;
  } catch (error) {
    console.error("初始化失敗:", error);
    statusInfo.textContent = "初始化失敗，請重新整理";
    statusInfo.style.background = "#e74c3c";
    setButtonsLock(true, "重新整理", "重新整理");
  }
});
</script>
