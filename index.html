<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
body {font-family:"Arial","Noto Sans TC",sans-serif;background:#f0f4f8;display:flex;justify-content:center;padding:20px;margin:0;}
.card {background:#fff;width:95%;max-width:480px;border-radius:20px;padding:25px 20px;display:flex;flex-direction:column;align-items:center;gap:20px;box-shadow:0 15px 30px rgba(0,0,0,0.15);}
#userInfo {font-size:28px;font-weight:bold;text-align:center;color:#2c3e50;}
#dateTime {font-size:22px;color:#7f8c8d;text-align:center;}
#statusInfo {font-size:20px;color:white;padding:8px 25px;border-radius:25px;text-align:center;min-width:180px;}
.buttons-container {display:flex;gap:15px;width:100%;}
.buttons-container button {flex:1;padding:15px 0;font-size:22px;font-weight:bold;border-radius:12px;border:none;cursor:pointer;color:white;transition:all 0.2s;}

/* 按鈕顏色：上班（橘色） / 下班（藍色） */
#btnStart {background: linear-gradient(135deg, #ff9f43, #ee5253);}
#btnEnd {background: linear-gradient(135deg, #3498db, #2980b9);}

button:disabled {opacity:0.5;cursor:not-allowed;}
#todayRecords {width:100%;background:#fafafa;border-radius:14px;padding:15px;border:1px solid #ddd;font-size:18px;text-align:left;}
#todayRecords span {display:block;margin-bottom:5px;padding-left:5px;border-left:3px solid #3498db;}

/* 主管審批按鈕 */
#btnApprove {
    margin-top:10px;
    padding:12px 20px;
    font-size:18px;
    font-weight:bold;
    border-radius:10px;
    background:linear-gradient(145deg,#8e44ad,#663399);
    color:white;
    display:none;
    width:100%;
    cursor:pointer;
    border:none;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
</style>
</head>
<body>
<div class="card">
  <div id="userInfo">載入使用者資訊中...</div>
  <div id="statusInfo">定位確認中…</div>
  <div id="dateTime">載入中…</div>
  <div class="buttons-container">
    <button id="btnStart" disabled>上班</button>
    <button id="btnEnd" disabled>下班</button>
  </div>
  <div id="todayRecords">今日打卡紀錄（點擊更新）</div>
  <button id="btnApprove">查看 | 簽核</button>
</div>

<script>
// ===== 設定 =====
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbzK1yWvwWKD3Hnmk8qdNkeUunmDbKOtOac6QyGSoNJPzxUaBeOsY15N7UB7saSeBNqAcg/exec";
const COMPANY_IPS  = ["220.134.112.245", "114.34.60.48"];
const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"
];

// ====== 更新日期時間 ======
function updateDateTime() {
    const now = new Date();
    document.getElementById("dateTime").textContent = now.toLocaleString("zh-TW", { hour12: false });
}
setInterval(updateDateTime, 1000);
updateDateTime();

// ====== 取得 IP ======
async function getIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;

    try {
        const res = await fetch("https://api.ipify.org?format=json");
        const data = await res.json();
        sessionStorage.setItem("myIP", data.ip);
        return data.ip;
    } catch {
        return "";
    }
}

// ====== 取得手機 GPS 經緯度 ======
function getGeoLocation() {
    return new Promise((resolve) => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                resolve({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                });
            },
            (error) => {
                console.warn("無法取得 GPS 座標: ", error.message);
                resolve({ lat: "", lng: "" });
            },
            { timeout: 10000, enableHighAccuracy: true }
        );
    });
}

// ====== 時間格式處理 ======
function fixTimeFormat(t) {
    if (typeof t === "string" && t.includes(":") && !t.includes("T")) return t;
    if (typeof t === "string" && t.includes("T")) return new Date(t).toLocaleTimeString("zh-TW", { hour12: false });
    if (!isNaN(t)) {
        const d = new Date((t - 25569) * 86400 * 1000);
        return d.toLocaleTimeString("zh-TW", { hour12: false });
    }
    return t;
}

const btnStart = document.getElementById("btnStart");
const btnEnd   = document.getElementById("btnEnd");

btnStart.disabled = true;
btnEnd.disabled = true;
window.userReady = false;
window.allowRemote = false;

// ====== 初始化使用者、IP 與遠端權限檢查 ======
async function updateUserInfo() {
    const liffInit = liff.init({ liffId: "2008520938-4018BD8v" });

    const [_, ip] = await Promise.all([
        liffInit,
        getIP()
    ]);

    if (!liff.isLoggedIn()) {
        await liff.login();
    }

    const [profile, finalIP] = await Promise.all([
        liff.getProfile(),
        getIP()
    ]);

    window.userId = profile.userId;
    window.userName = profile.displayName;

    document.getElementById("userInfo").textContent = `${window.userName} 您好`;
    document.getElementById("btnApprove").style.display = MANAGERS.includes(window.userId) ? "block" : "none";

    // 查詢後端確認該用戶是否允許異地
    try {
        const remoteRes = await fetch(`${API_ENDPOINT}?action=checkRemote&userId=${window.userId}`);
        const remoteData = await remoteRes.json();
        window.allowRemote = remoteData.allowed;
    } catch(err) {
        console.error("查詢允許異地失敗", err);
        window.allowRemote = false;
    }

    const s = document.getElementById("statusInfo");
    const isCompany = COMPANY_IPS.includes(finalIP);

    if (isCompany || window.allowRemote) {
        // ★ 有效打卡區：解鎖上班與下班按鈕
        s.textContent = "有效打卡區";
        s.style.color = "#008000";
        s.style.backgroundColor = "rgba(144,238,144,0.6)";
        btnStart.disabled = false;
        btnEnd.disabled = false;
        window.userReady = true;
    } else {
        // ★ 無效打卡區：鎖住上班與下班按鈕
        s.textContent = "無效打卡區";
        s.style.color = "#FF0000";
        s.style.backgroundColor = "rgba(255,182,193,0.3)";
        btnStart.disabled = true;
        btnEnd.disabled = true;
        window.userReady = false;
    }

    s.style.padding = "5px 15px";
    s.style.borderRadius = "20px";
    s.style.display = "inline-block";
    s.style.fontWeight = "bold";
}

document.addEventListener("DOMContentLoaded", updateUserInfo);

/* ===== 打卡後發送 Flex Message ===== */
async function sendSelfMessage(record) {
    if (!liff.isInClient()) return;

    let headerColor = "#3498db"; 
    if (record.status === "下班") headerColor = "#2ecc71"; 

    try {
        await liff.sendMessages([{
            type: 'flex',
            altText: '打卡通知',
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{
                        type: "text",
                        text: `${record.userName} 已打卡`,
                        weight: "bold",
                        size: "lg",
                        color: "#ffffff"
                    }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.netType}`, size: "md" }
                    ]
                }
            }
        }]);
        await new Promise(r => setTimeout(r, 800));
    } catch(err) {
        console.error("LIFF 訊息傳送失敗:", err);
    }
}

// ===== 打卡函式 =====
async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (!window.userReady && !isMakeup) {
        Swal.fire({ icon:"warning", title:"提示", html:"目前為無效打卡區，無法打卡！", timer:1500, showConfirmButton:false });
        return;
    }

    const ip = await getIP();

    if (!isMakeup && !COMPANY_IPS.includes(ip) && !window.allowRemote) {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            html: `<span style="color:#e74c3c; font-weight:bold;">非公司網路且未授權異地打卡！</span>`,
            confirmButtonText: "確定"
        });
        return;
    }

    let lat = "", lng = "";
    if (window.allowRemote && !COMPANY_IPS.includes(ip)) {
        const geo = await getGeoLocation();
        lat = geo.lat;
        lng = geo.lng;
    }

    Swal.fire({
        html: `
            <div style="padding: 10px 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
                <div class="custom-loader-spinner" style="
                    width: 50px;
                    height: 50px;
                    margin: 0 auto 18px auto;
                    border: 4px solid #f3f3f3;
                    border-top: 4px solid #3498db;
                    border-radius: 50%;
                    animation: spin 0.8s linear infinite;
                "></div>
                <h3 style="margin: 0 0 8px 0; color: #2c3e50; font-size: 20px; font-weight: 600;">系統打卡處理中</h3>
                <p style="margin: 0; color: #7f8c8d; font-size: 14px; letter-spacing: 0.5px;">正在與雲端伺服器安全同步，請稍候...</p>
                <style>
                    @keyframes spin {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                    }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        backdrop: "rgba(0,0,0,0.5)"
    });

    let apiData = null;
    try {
        const res = await fetch(API_ENDPOINT, {
            method: "POST",
            body: JSON.stringify({ userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup })
        });
        apiData = await res.json();
    } catch(err) {
        console.error(err);
        apiData = { message:"失敗" };
    }

    if (apiData.message && (apiData.message.includes("成功") || apiData.message.includes("更新"))) {
        await sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
        });

        Swal.fire({
            icon: "success",
            title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
            html: `<strong>打卡時間：</strong> ${apiData.date} ${apiData.time}`,
            showConfirmButton: false,
            timer: 2000,
            backdrop: "rgba(0,0,0,0.5)"
        });
    } else {
        Swal.fire({
            icon: "error",
            title: "打卡失敗",
            text: apiData.message || "打卡失敗，請檢查網路！",
            confirmButtonText: "確定"
        });
    }

    updateTodayRecords();
}

// ===== 取得今日紀錄 =====
async function updateTodayRecords() {
    if (!window.userId) return;
    const now = new Date();
    const today = now.toLocaleDateString("zh-TW").replace(/\//g, "/");

    try {
        const res = await fetch(`${API_ENDPOINT}?action=getToday&userId=${window.userId}&date=${today}`);
        const data = await res.json();

        const container = document.getElementById("todayRecords");
        if (!data.length) {
            container.innerHTML = "今日打卡紀錄：無";
            return;
        }

        container.innerHTML = "今日打卡紀錄：<br>" + data.map(r => {
            const time = fixTimeFormat(r.time);
            const makeup = r.isMakeup ? "(補打卡-待審核)" : "";
            return `${r.status} ${time} (成功) ${makeup}`;
        }).join("<br>");

    } catch(err) {
        console.error(err);
        document.getElementById("todayRecords").innerHTML = "今日打卡紀錄：讀取失敗";
    }
}

document.getElementById("btnStart").onclick = () => performClockIn("上班");
document.getElementById("btnEnd").onclick = () => performClockIn("下班");

document.getElementById("btnApprove").onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
};

window.onload = async () => {
    await updateUserInfo();
    await updateTodayRecords();
};
</script>

</body>
</html>
