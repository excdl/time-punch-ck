<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能打卡系統</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      padding: 20px;
      margin: 0;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      width: 95%;
      max-width: 480px;
      border-radius: 20px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
    }
    #userInfo { font-size: 28px; font-weight: bold; text-align: center; color: #2c3e50; }
    #dateTime { font-size: 22px; color: #7f8c8d; text-align: center; }
    #statusInfo {
      font-size: 20px;
      color: white;
      padding: 8px 25px;
      border-radius: 25px;
      text-align: center;
      min-width: 180px;
    }
    .buttons-container { display: flex; gap: 15px; width: 100%; }
    .buttons-container button {
      flex: 1;
      padding: 15px 0;
      font-size: 22px;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: white;
      transition: all 0.2s;
    }
    #btnStart { background: linear-gradient(135deg, #ff9f43, #ee5253); }
    #btnEnd { background: linear-gradient(135deg, #3498db, #2980b9); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* 今日紀錄 */
    #todayRecordsContainer {
      width: 100%;
      background: #fafbfc;
      border-radius: 16px;
      padding: 16px;
      border: 1px solid #e1e8ed;
    }
    .records-title {
      font-size: 16px;
      font-weight: bold;
      color: #34495e;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .record-item {
      background: #fff;
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 5px solid #3498db;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .record-item:last-child { margin-bottom: 0; }
    .record-info { display: flex; flex-direction: column; gap: 2px; }
    .record-status { font-size: 16px; font-weight: bold; color: #2c3e50; }
    .record-details { font-size: 13px; color: #7f8c8d; }
    .record-time { font-size: 18px; font-weight: bold; color: #2c3e50; }
    .badge-makeup {
      background: #e67e22;
      color: white;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 6px;
      margin-left: 4px;
    }
    .records-empty { text-align: center; color: #95a5a6; font-size: 15px; padding: 15px 0; }

    /* 簽核 */
    #btnApprove {
      margin-top: 10px;
      padding: 12px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
      background: linear-gradient(145deg, #8e44ad, #663399);
      color: white;
      display: none;
      width: 100%;
      cursor: pointer;
      border: none;
    }

    /* SweetAlert */
    .swal2-popup.custom-swal-popup {
      border-radius: 20px !important;
      padding: 24px !important;
      font-family: Arial, "Noto Sans TC", sans-serif !important;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
    }
    .swal2-title { font-size: 22px !important; color: #2c3e50 !important; font-weight: bold !important; }
    .swal2-html-container { font-size: 16px !important; color: #555 !important; }
    .swal2-styled.swal2-confirm {
      background: linear-gradient(135deg, #3498db, #2980b9) !important;
      border-radius: 10px !important;
      font-size: 16px !important;
      font-weight: bold !important;
      padding: 10px 24px !important;
    }

    /* Loading */
    #countdownWrapper {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(255,255,255,0.92);
      z-index: 999999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(3px);
    }
    #circleProgress {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.12s linear;
    }
    #countdownText { margin-top: 15px; font-size: 17px; font-weight: bold; color: #2c3e50; text-align: center; }
    .loading-sub { margin-top: 8px; font-size: 13px; color: #7f8c8d; }
  </style>
</head>
<body>
  <div class="card">
    <div id="userInfo">載入使用者資訊中...</div>
    <div id="statusInfo">網路與定位初始化中…</div>
    <div id="dateTime">載入中…</div>
    <div class="buttons-container">
      <button id="btnStart" disabled>同步中…</button>
      <button id="btnEnd" disabled>同步中…</button>
    </div>

    <!-- Loading -->
    <div id="countdownWrapper">
      <svg width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="50" stroke="#eeeeee" stroke-width="12" fill="none"></circle>
        <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
      </svg>
      <div id="countdownText">打卡中...</div>
      <div class="loading-sub">請勿關閉此頁面</div>
    </div>

    <!-- 今日紀錄 -->
    <div id="todayRecordsContainer">
      <div class="records-title">📋 今日打卡紀錄</div>
      <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>

    <button id="btnApprove">查看｜簽核</button>
  </div>

  <script>
    const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbwxiYp9OnSFEUaF8m5EsnoD6lCkeSczgqsvpchFYNAKj2iN_FvTTT7TX_TXiF5gLPyNSQ/exec";
    const COMPANY_IPS = ["220.134.112.245","114.34.60.48"];
    const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86","U7fdf4fbd467b9a93a23fac01ed03351b"];
    const LIFF_ID = "2008520938-4018BD8v";

    const userInfo = document.getElementById("userInfo");
    const statusInfo = document.getElementById("statusInfo");
    const dateTime = document.getElementById("dateTime");
    const btnStart = document.getElementById("btnStart");
    const btnEnd = document.getElementById("btnEnd");
    const todayRecords = document.getElementById("todayRecords");
    const btnApprove = document.getElementById("btnApprove");
    const loadingWrapper = document.getElementById("countdownWrapper");
    const loadingCircle = document.getElementById("circleProgress");
    const loadingText = document.getElementById("countdownText");

    window.userId = "";
    window.userName = "";
    window.allowRemote = false;
    window.userReady = false;
    window.isSubmitting = false;
    window.currentIP = "";

    function updateDateTime() {
      dateTime.textContent = new Date().toLocaleString("zh-TW", { hour12: false });
    }
    updateDateTime();
    setInterval(updateDateTime, 1000);

    function setButtonsLock(locked, startText = "上班", endText = "下班") {
      btnStart.disabled = locked || window.isSubmitting;
      btnEnd.disabled = locked || window.isSubmitting;
      btnStart.textContent = startText;
      btnEnd.textContent = endText;
      window.userReady = !locked;
    }

    async function preloadIP() {
      if (window.currentIP) return window.currentIP;
      const cached = sessionStorage.getItem("myIP");
      if (cached) { window.currentIP = cached; return cached; }

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 3000);
      try {
        const response = await fetch("https://api.ipify.org?format=json", { signal: controller.signal, cache: "no-store" });
        clearTimeout(timeout);
        if (!response.ok) throw new Error("IP API error");
        const data = await response.json();
        const ip = String(data.ip || "").trim();
        if (ip) { window.currentIP = ip; sessionStorage.setItem("myIP", ip); }
        return ip;
      } catch (error) {
        clearTimeout(timeout);
        return "";
      }
    }

    function loadUserFromCache() {
      const cachedUserId = localStorage.getItem("cached_userId");
      const cachedUserName = localStorage.getItem("cached_userName");
      if (cachedUserId) {
        window.userId = cachedUserId;
        window.userName = cachedUserName || "使用者";
        userInfo.textContent = `${window.userName} 您好`;
      }
      const cachedRecords = sessionStorage.getItem("cached_today_records");
      if (cachedRecords) {
        try { renderRecords(JSON.parse(cachedRecords)); } catch (error) {}
      }
    }

    async function initUser() {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return false; }
      const profile = await liff.getProfile();
      window.userId = profile.userId;
      window.userName = profile.displayName || "使用者";
      userInfo.textContent = `${window.userName} 您好`;
      localStorage.setItem("cached_userId", window.userId);
      localStorage.setItem("cached_userName", window.userName);
      btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
      return true;
    }

    async function fetchJson(url, options = {}, timeoutMs = 10000) {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
        clearTimeout(timeout);
        const text = await response.text();
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return JSON.parse(text);
      } catch (error) {
        clearTimeout(timeout);
        throw error;
      }
    }

    async function updateStatus() {
      const ip = await preloadIP();
      const isCompany = COMPANY_IPS.includes(ip);
      if (isCompany) {
        window.allowRemote = false;
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
        return;
      }
      if (!window.userId) {
        statusInfo.textContent = "等待 LINE 使用者資訊";
        statusInfo.style.background = "#95a5a6";
        setButtonsLock(true, "上班", "下班");
        return;
      }
      try {
        const result = await fetchJson(`${API_ENDPOINT}?action=checkRemote&userId=${encodeURIComponent(window.userId)}`, {}, 7000);
        window.allowRemote = result.allowed === true;
      } catch (error) {
        window.allowRemote = false;
      }

      if (window.allowRemote) {
        statusInfo.textContent = "有效打卡區（異地）";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
      } else {
        statusInfo.textContent = "無效打卡區";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "上班", "下班");
      }
    }

    function getGeoLocation() {
      return new Promise(resolve => {
        if (!navigator.geolocation) { resolve({ lat: "", lng: "" }); return; }
        navigator.geolocation.getCurrentPosition(
          position => resolve({ lat: position.coords.latitude, lng: position.coords.longitude }),
          () => resolve({ lat: "", lng: "" }),
          { timeout: 6000, enableHighAccuracy: true, maximumAge: 30000 }
        );
      });
    }

    function startLoading(status) {
      loadingWrapper.style.display = "flex";
      loadingWrapper.style.opacity = "1";
      loadingText.textContent = status === "上班" ? "上班打卡中..." : "下班打卡中...";
      const radius = 50;
      const circumference = 2 * Math.PI * radius;
      loadingCircle.style.strokeDasharray = circumference;
      loadingCircle.style.strokeDashoffset = circumference;
      loadingCircle.style.stroke = status === "下班" ? "#2ecc71" : "#3498db";
      return { circumference };
    }

    function updateLoading(progress, circumference) {
      const safeProgress = Math.max(0, Math.min(1, progress));
      loadingCircle.style.strokeDashoffset = circumference * (1 - safeProgress);
    }

    function stopLoading() {
      loadingWrapper.style.opacity = "0";
      setTimeout(() => { loadingWrapper.style.display = "none"; loadingWrapper.style.opacity = "1"; }, 180);
    }

    function fixTimeFormat(value) {
      if (!value) return "00:00:00";
      if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
        const parts = value.split(":");
        while (parts.length < 3) parts.push("00");
        return parts.slice(0, 3).map(v => String(v).padStart(2, "0")).join(":");
      }
      if (typeof value === "string" && value.includes("T")) {
        const d = new Date(value);
        if (!isNaN(d)) return d.toLocaleTimeString("zh-TW", { hour12: false });
      }
      return String(value);
    }

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
    }

    function renderRecords(data) {
      if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
      }
      todayRecords.innerHTML = data.map(record => {
        const status = record.status === "下班" ? "下班" : "上班";
        const color = status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(record.time);
        const isCompany = COMPANY_IPS.includes(String(record.ip || "").trim());
        const networkLabel = isCompany ? "公司網路" : "異地打卡";
        const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
        const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

        return `
          <div class="record-item" style="border-left-color:${color};">
            <div class="record-info">
              <div class="record-status">${status} ${makeupBadge}</div>
              <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
            </div>
            <div class="record-time" style="color:${color};">${time}</div>
          </div>
        `;
      }).join("");
    }

    async function updateTodayRecords() {
      if (!window.userId) return;
      try {
        const date = getTodayString();
        const result = await fetchJson(`${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}`, {}, 8000);
        const data = Array.isArray(result) ? result : (Array.isArray(result.data) ? result.data : []);
        sessionStorage.setItem("cached_today_records", JSON.stringify(data));
        renderRecords(data);
      } catch (error) {
        const cache = sessionStorage.getItem("cached_today_records");
        if (!cache) {
          todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄讀取失敗</div>`;
        }
      }
    }

    async function sendSelfMessage(record) {
      try {
        if (!window.liff || !liff.isInClient()) return;
        const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";
        await liff.sendMessages([{
          type: "flex",
          altText: `【打卡通知】${record.status}成功`,
          contents: {
            type: "bubble",
            header: {
              type: "box", layout: "vertical",
              contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
              backgroundColor: headerColor, paddingAll: "12px"
            },
            body: {
              type: "box", layout: "vertical", spacing: "md",
              contents: [
                { type: "text", text: `狀態：${record.status}`, size: "md" },
                { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                { type: "text", text: `網路：${record.netType}`, size: "md" }
              ]
            }
          }
        }]);
      } catch (error) {}
    }

    function showClockResult(apiData, status, isMakeup) {
      Swal.fire({
        icon: "success",
        title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
        html: `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${apiData.date || ""} ${apiData.time || ""}</span></div>`,
        showConfirmButton: false,
        timer: 1800,
        timerProgressBar: true,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: "custom-swal-popup" }
      });
    }

    async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
      if (window.isSubmitting) return;

      if (!window.userId) {
        Swal.fire({ icon: "warning", title: "提示", text: "尚未取得 LINE 使用者資訊，請稍候再試。", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
        return;
      }

      if (!window.userReady && !isMakeup) {
        Swal.fire({ icon: "warning", title: "目前無法打卡", text: "目前為無效打卡區，無法打卡！", confirmButtonText: "確定", customClass: { popup: "custom-swal-popup" } });
        return;
      }

      window.isSubmitting = true;
      setButtonsLock(true, "打卡中...", "打卡中...");

      const loading = startLoading(status);
      let loadingProgress = 0;
      const loadingTimer = setInterval(() => {
        loadingProgress = Math.min(loadingProgress + 0.03, 0.9);
        updateLoading(loadingProgress, loading.circumference);
      }, 100);

      try {
        const ip = await preloadIP();
        const isCompany = COMPANY_IPS.includes(ip);

        if (!isMakeup && !isCompany && !window.allowRemote) {
          throw new Error("非公司網路且未授權異地打卡！");
        }

        let lat = "", lng = "";
        if (!isMakeup && !isCompany && window.allowRemote) {
          const geo = await getGeoLocation();
          lat = geo.lat;
          lng = geo.lng;
        }

        const payload = { userId: window.userId, displayName: window.userName, status, ip, lat, lng, customDate, customTime, isMakeup };
        const apiData = await fetchJson(API_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        }, 12000);

        if (!apiData || apiData.success !== true) {
          throw new Error(apiData?.message || "打卡失敗，請稍後再試");
        }

        updateLoading(1, loading.circumference);
        clearInterval(loadingTimer);
        stopLoading();

        showClockResult(apiData, status, isMakeup);

        sendSelfMessage({
          userName: window.userName, status, date: apiData.date, time: apiData.time,
          netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
        }).catch(() => {});

        setTimeout(() => { updateTodayRecords(); }, 300);

      } catch (error) {
        clearInterval(loadingTimer);
        stopLoading();
        Swal.fire({
          icon: "error",
          title: "打卡失敗",
          html: `<div style="color:#c0392b;font-weight:bold;line-height:1.7;">${escapeHtml(error.message || "網路連線異常")}</div>`,
          confirmButtonText: "確定",
          customClass: { popup: "custom-swal-popup" }
        });
      } finally {
        clearInterval(loadingTimer);
        window.isSubmitting = false;
        await updateStatus();
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    btnStart.onclick = () => { performClockIn("上班"); };
    btnEnd.onclick = () => { performClockIn("下班"); };
    btnApprove.onclick = () => {
      window.location.href = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";
    };

    window.addEventListener("load", async () => {
      statusInfo.textContent = "系統初始化中...";
      statusInfo.style.background = "#95a5a6";
      setButtonsLock(true, "同步中...", "同步中...");

      loadUserFromCache();

      try {
        const results = await Promise.allSettled([initUser(), preloadIP()]);
        if (results[0].status === "rejected") throw results[0].reason;

        if (!window.userId) {
          statusInfo.textContent = "請完成 LINE 登入";
          statusInfo.style.background = "#95a5a6";
          return;
        }

        await Promise.allSettled([updateStatus(), updateTodayRecords()]);
      } catch (error) {
        statusInfo.textContent = "初始化失敗，請重新整理";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "重新整理", "重新整理");
      }
    });
  </script>
</body>
</html>


<script>
/*************************************************
 * 智能打卡系統 - 前端優化版
 *************************************************/

const API_ENDPOINT = "https://script.google.com/macros/s/AKfycby4Sv2rT9VI1D5IutGMdxI7OzQKkOH5XcMe4zr2dH2YT-5vtW751iyaEoAI89ISkPAaTw/exec";

const COMPANY_IPS = [
    "220.134.112.245",
    "114.34.60.48"
];

const MANAGERS = [
    "U76174e2a9654ab2c7b1f037b28cb6c86",
    "U7fdf4fbd467b9a93a23fac01ed03351b"
];

const LIFF_ID = "2008520938-4018BD8v";

/* =================================================
 * DOM
 * ================================================= */

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const todayRecords = document.getElementById("todayRecords");
const btnApprove = document.getElementById("btnApprove");

/* =================================================
 * 全域狀態
 * ================================================= */

window.userId = "";
window.userName = "";
window.allowRemote = false;
window.userReady = false;
window.currentIP = "";
window.currentRequestId = "";
window.isSubmitting = false;
window.statusUpdating = false;
window.recordsUpdating = false;
window.lastRecordSync = 0;
window.lastStatusSync = 0;
window.recordsSyncPromise = null;
window.ipPromise = null;
window.statusPromise = null;

/* =================================================
 * 基本工具
 * ================================================= */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =================================================
 * 時間
 * ================================================= */

function updateDateTime() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");

            year: "numeric",
            month: "long",
            day: "numeric",
            weekday: "short"
        });
    }
}

/* =================================================
 * fetch JSON
 * ================================================= */

async function fetchJson(url, options = {}, timeoutMs = 8000) {
    const controller = new AbortController();
    const timeout = setTimeout(() => {
        controller.abort();
    }, timeoutMs);

    try {
        const response = await fetch(url, {
            ...options,
            signal: controller.signal,
            cache: "no-store"
        });

        const text = await response.text();

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        if (!text) {
            throw new Error("伺服器沒有回傳資料");
        }

        try {
            return JSON.parse(text);
        } catch (parseError) {
            console.warn("JSON 解析失敗，原始回應：", text);
            throw new Error("伺服器回傳格式錯誤");
        }
    } catch (error) {
        if (error && error.name === "AbortError") {
            const timeoutError = new Error("REQUEST_TIMEOUT");
            timeoutError.code = "REQUEST_TIMEOUT";
            throw timeoutError;
        }
        throw error;
    } finally {
        clearTimeout(timeout);
    }
}

function isCompanyIP(ip) {
    return COMPANY_IPS.includes(String(ip || "").trim());

/* =================================================
 * 取得目前 IP
 * ================================================= */

async function preloadIP(forceRefresh = false) {
    if (window.currentIP && !forceRefresh) {
        return window.currentIP;
    }

    const cached = sessionStorage.getItem("myIP");
    if (cached && !forceRefresh) {
        window.currentIP = cached;
        return cached;
    }

    if (window.ipPromise && !forceRefresh) {
        return window.ipPromise;
    }

    window.ipPromise = (async () => {
        try {
            const response = await fetchJson("https://api.ipify.org?format=json", {}, 3000);
            const ip = String(response.ip || "").trim();
            if (ip) {
                window.currentIP = ip;
                sessionStorage.setItem("myIP", ip);
            }
            return ip;
        } catch (error) {
            console.warn("IP 取得失敗:", error);
            return window.currentIP || cached || "";
        } finally {
            window.ipPromise = null;
        }
    })();

    return window.ipPromise;
}

/* =================================================
 * GPS
 * ================================================= */

function getGeoLocation() {
    return new Promise(resolve => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }

        navigator.geolocation.getCurrentPosition(
            position => {
                resolve({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                });
            },
            error => {
                console.warn("GPS 取得失敗:", error);
                resolve({ lat: "", lng: "" });
            },
            {
                timeout: 5000,
                enableHighAccuracy: true,
                maximumAge: 30000
            }
        );
    });
}

function getTodayString() {
    const now = new Date();
    return (
        now.getFullYear() +

        "/" +
        String(now.getDate()).padStart(2, "0")
    );
}

/* =================================================
 * 時間格式
 * ================================================= */

function fixTimeFormat(value) {
    if (value === null || value === undefined || value === "") {
        return "00:00:00";
    }

    if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
        const parts = value.split(":");
        while (parts.length < 3) {
            parts.push("00");
        }
        return parts.slice(0, 3).map(v => String(v).padStart(2, "0")).join(":");
    }

    if (typeof value === "string" && value.includes("T")) {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }

    if (typeof value === "number") {
        const d = new Date((value - 25569) * 86400 * 1000);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }

    return String(value);
}

/* =================================================
 * 顯示紀錄
 * ================================================= */

function renderRecords(data) {
    if (!todayRecords) return;

    if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }

    const sorted = [...data].sort((a, b) => {
        const ta = String(a.time || "");
        const tb = String(b.time || "");
        return ta.localeCompare(tb);
    });

    todayRecords.innerHTML = sorted.map(record => {
        const status = record.status === "下班" ? "下班" : "上班";
        const color = status === "下班" ? "#2ecc71" : "#3498db";
        const time = fixTimeFormat(record.time);
        const isCompany = isCompanyIP(record.ip);
        const networkLabel = isCompany ? "公司網路" : "異地打卡";
        const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
        const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";

        return `
            <div class="record-item" style="border-left-color:${color};">
                <div class="record-info">
                    <div class="record-status">${escapeHtml(status)}${makeupBadge}</div>
                    <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
                </div>
                <div class="record-time" style="color:${color};">${escapeHtml(time)}</div>
            </div>
        `;
    }).join("");
}

/* =================================================
 * 解析今日紀錄 API
 * ================================================= */

function parseRecordsResponse(result) {
    if (result && Array.isArray(result.data)) {
        return result.data;
    }
    if (Array.isArray(result)) {
        return result;
    }
    return [];
}

/* =================================================
 * 今日紀錄
 * ================================================= */

async function updateTodayRecords(options = {}) {
    if (!window.userId) {
        return [];
    }

    if (window.recordsSyncPromise && !options.force) {
        return window.recordsSyncPromise;
    }

    window.recordsSyncPromise = (async () => {
        try {
            const date = getTodayString();
            const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}&_=${Date.now()}`;

            const result = await fetchJson(url, {}, options.timeout || 5000);

            if (result && result.success === false) {
                throw new Error(result.message || "紀錄讀取失敗");
            }

            const data = parseRecordsResponse(result);

            sessionStorage.setItem("cached_today_records", JSON.stringify(data));
            renderRecords(data);
            window.lastRecordSync = Date.now();
            return data;
        } catch (error) {
            console.warn("今日紀錄背景同步失敗:", error);
            return null;
        } finally {
            window.recordsSyncPromise = null;
        }
    })();

    return window.recordsSyncPromise;
}

/* =================================================
 * 打卡結果確認
 * ================================================= */

async function confirmClockRecord(requestId, status, maxWaitMs = 7000) {
    const startedAt = Date.now();
    let attempt = 0;

    while (Date.now() - startedAt < maxWaitMs) {
        attempt++;

        try {
            const date = getTodayString();
            const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(date)}&_=${Date.now()}`;

            const result = await fetchJson(url, {}, 3000);
            const data = parseRecordsResponse(result);

            const found = data.find(record => {
                const sameRequest = String(record.requestId || "").trim() === String(requestId).trim();
                const sameStatus = String(record.status || "").trim() === String(status).trim();
                return sameRequest && sameStatus;
            });

            if (found) {
                sessionStorage.setItem("cached_today_records", JSON.stringify(data));
                renderRecords(data);
                return {
                    success: true,
                    date: found.date || date,
                    time: found.time || "",
                    record: found
                };
            }
        } catch (error) {
            console.warn(`確認打卡結果第 ${attempt} 次失敗:`, error);
        }

        const waitMs = Math.min(800 + (attempt - 1) * 400, 2000);
        await new Promise(resolve => setTimeout(resolve, waitMs));
    }

    return { success: false };
}

/* =================================================
 * 打卡
 * ================================================= */

async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (window.isSubmitting) {
        return;
    }

    if (!window.userId) {
        await Swal.fire({
            icon: "warning",
            title: "提示",
            text: "尚未取得 LINE 使用者資訊，請稍候再試。",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }

    if (!window.userReady && !isMakeup) {
        await Swal.fire({
            icon: "warning",
            title: "目前無法打卡",
            text: "目前為無效打卡區，無法打卡！",
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });
        return;
    }

    window.isSubmitting = true;
    window.currentRequestId = createRequestId();
    const requestId = window.currentRequestId;

    setButtonsLock(true, "處理中...", "處理中...");

    showClockLoading(
        isMakeup ? "補打卡中" : (status === "上班" ? "上班打卡中" : "下班打卡中"),
        "正在確認打卡資料，請稍候..."
    );

    try {
        const ip = await preloadIP();
        const isCompany = isCompanyIP(ip);

        if (!isMakeup && !isCompany && !window.allowRemote) {
            throw new Error("非公司網路且未授權異地打卡！");
        }

        let lat = "";
        let lng = "";

        if (!isMakeup && !isCompany && window.allowRemote) {
            updateClockLoading(
                status === "上班" ? "上班打卡中" : "下班打卡中",
                "正在取得定位資料..."
            );
            const geo = await getGeoLocation();
            lat = geo.lat;
            lng = geo.lng;
        }

        const payload = {
            userId: window.userId,
            displayName: window.userName,
            status: status,
            ip: ip,
            lat: lat,
            lng: lng,
            customDate: customDate,
            customTime: customTime,
            isMakeup: isMakeup,
            requestId: requestId
        };

        updateClockLoading(
            isMakeup ? "補打卡中" : (status === "上班" ? "上班打卡中" : "下班打卡中"),
            "資料正在送出，請稍候..."
        );

        let apiData;

        try {
            apiData = await fetchJson(
                API_ENDPOINT,
                {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)
                },
                12000
            );
        } catch (postError) {
            if (
                postError.code === "REQUEST_TIMEOUT" ||
                postError.message === "Failed to fetch" ||
                postError.name === "TypeError"
            ) {
                updateClockLoading(
                    "正在確認打卡結果",
                    "伺服器回應較慢，正在確認是否已完成打卡..."
                );

                const confirmed = await confirmClockRecord(requestId, status, 7000);

                if (confirmed.success) {
                    apiData = {
                        success: true,
                        date: confirmed.date,
                        time: confirmed.time,
                        message: "打卡成功",
                        requestId: requestId
                    };
                } else {
                    throw new Error("伺服器回應較慢，目前無法確認結果。請先不要重複打卡，稍後重新整理頁面確認紀錄。");
                }
            } else {
                throw postError;
            }
        }

        if (!apiData || apiData.success !== true) {
            throw new Error(apiData?.message || "打卡失敗，請稍後再試");
        }

        Swal.close();

        await showClockResult(apiData, status, isMakeup);

        sendSelfMessage({
            userName: window.userName,
            status: status,
            date: apiData.date,
            time: apiData.time,
            netType: isCompany ? "公司網路" : "異地打卡(GPS)"
        }).catch(() => {});

        updateTodayRecords({
            force: true,
            timeout: 4000
        }).catch(() => {});
    } catch (error) {
        console.error("performClockIn error:", error);
        Swal.close();

        await Swal.fire({
            icon: "error",
            title: "打卡結果",
            html: `<div style="color:#c0392b; font-weight:bold; line-height:1.7;">${escapeHtml(error.message || "網路連線異常")}</div>`,
            confirmButtonText: "確定",
            customClass: { popup: "custom-swal-popup" }
        });

        updateTodayRecords({
            force: true,
            timeout: 4000
        }).catch(() => {});
    } finally {
        window.isSubmitting = false;

        setButtonsLock(false, "上班", "下班");

        updateStatus().catch(error => {
            console.warn("背景更新狀態失敗:", error);
        });
    }
}

    if (!window.userId) {
      statusInfo.textContent = "請完成 LINE 登入";
      statusInfo.style.background = "#95a5a6";
      setButtonsLock(true, "上班", "下班");
      return;
    }

    window.initialized = true;

    // 4. 【關鍵修改】確保 userId 已經存在後，才正式向後台查詢「異地特許」等權限
    await updateStatus();
    updateTodayRecords(true).catch(() => {});

  } catch (error) {
    console.error("初始化失敗:", error);
    if (window.userId) {
      statusInfo.textContent = "網路較慢，正在使用暫存資料";
      statusInfo.style.background = "#f39c12";
      setTimeout(() => {
        updateStatus().catch(() => {});
      }, 1000);
    } else {
      statusInfo.textContent = "初始化失敗，請重新整理";
      statusInfo.style.background = "#e74c3c";
      setButtonsLock(true, "重新整理", "重新整理");
    }
  }
});

/* =================================================
 * 頁面回到前景
 * ================================================= */

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") {
        return;
    }

    if (!window.userId) {
        return;
    }

    updateTodayRecords({
        force: true,
        timeout: 4000
    }).catch(() => {});

    updateStatus().catch(() => {});
});

</script>
</body>
</html>
