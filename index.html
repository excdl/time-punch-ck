<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}
* {
    box-sizing: border-box;
}
body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}
.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}
.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}
.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
    overflow: hidden;
}
.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 20px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 14px;
    font-weight: bold;
    color: var(--text-sub);
}
#statusInfo {
    font-size: 14px;
    font-weight: bold;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}
.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}
.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}
.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    border: 1px solid #edf2f7;
}
#timeHour, #timeMin, #timeSec {
    font-size: 38px;
    font-weight: normal;
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}
.time-separator {
    font-size: 32px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}
@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 22px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }
button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}
button:not(:disabled):active {
    transform: scale(0.97);
}
.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
    animation: fadeIn 0.3s ease-in-out;
}
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.badge-makeup {
    background: #e67e22;
    color: white;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    margin-left: 4px;
    vertical-align: middle;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}
#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}
.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.swal2-title {
    font-size: 22px !important;
    color: #2c3e50 !important;
    font-weight: bold !important;
}
.swal2-html-container {
    font-size: 16px !important;
    color: #555 !important;
}
.swal2-styled.swal2-confirm {
    background: linear-gradient(135deg, #3498db, #2980b9) !important;
    border-radius: 10px !important;
    font-size: 16px !important;
    font-weight: bold !important;
    padding: 10px 24px !important;
    box-shadow: 0 4px 12px rgba(52,152,219,0.3) !important;
}
#countdownWrapper {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(255,255,255,0.88);
    z-index: 99999;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(2px);
}
#countdownWrapper.show {
    display: flex;
}
#circleProgress {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
}
#countdownText {
    margin-top: 15px;
    font-size: 16px;
    font-weight: bold;
    color: #2c3e50;
    white-space: nowrap;
}
.loading-subtext {
    margin-top: 8px;
    color: #7f8c8d;
    font-size: 13px;
}
@media (max-width: 380px) {
    #timeHour, #timeMin, #timeSec { font-size: 30px; }
    .clock-container { padding: 12px 12px; gap: 5px; }
    .time-box { padding: 7px 9px; }
    .buttons-container { gap: 10px; }
    .buttons-container button { font-size: 20px; }
}
</style>
</head>
<body>
<div class="app-container">
    <div class="app-header">
        <div class="user-profile-container">
            <div class="user-avatar" id="userAvatar">👤</div>
            <div class="user-profile">
                <div id="userInfo">載入中...</div>
                <div class="app-subtitle" id="headerDate">載入日期中...</div>
            </div>
        </div>
        <div id="statusInfo">檢查中...</div>
    </div>
    <div class="dashboard-card">
        <div class="clock-container">
            <div class="time-box"><span id="timeHour">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeMin">00</span></div>
            <span class="time-separator">:</span>
            <div class="time-box"><span id="timeSec">00</span></div>
        </div>
        <div class="buttons-container">
            <button id="btnStart" disabled>上班</button>
            <button id="btnEnd" disabled>下班</button>
        </div>
    </div>
    <div id="countdownWrapper" aria-hidden="true">
        <svg width="120" height="120">
            <circle cx="60" cy="60" r="50" stroke="#eee" stroke-width="12" fill="none"></circle>
            <circle id="circleProgress" cx="60" cy="60" r="50" stroke="#3498db" stroke-width="12" fill="none" transform="rotate(-90 60 60)"></circle>
        </svg>
        <div id="countdownText">打卡中...</div>
        <div class="loading-subtext">請稍候，正在送出打卡資料</div>
    </div>
    <div class="section-container">
        <div class="section-title">📋 今日打卡紀錄</div>
        <div id="todayRecords" class="records-empty">正在載入紀錄…</div>
    </div>
    <button id="btnApprove">查看 | 簽核</button>
</div>
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbxykVbT8_c3gzA2gAGOzWHHKgKAUmJ74rc95QF2cpeMBb4Ts5Emd1SNXIcQYJ46KEK2SQ/exec";
const COMPANY_IPS = ["220.134.112.245", "114.34.60.48"];
const MANAGERS = ["U76174e2a9654ab2c7b1f037b28cb6c86", "U7fdf4fbd467b9a93a23fac01ed03351b"];
const LIFF_ID = "2008520938-4018BD8v";
const APPROVE_URL = "https://script.google.com/macros/s/AKfycbyxXrvVxfgwrI-SdXM03QEYxEpG-xqyjVQcxdNz1IBK3DtFC-kUFjHhRaNtgXNU-Mdu/exec";

const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const btnApprove = document.getElementById("btnApprove");
const todayRecords = document.getElementById("todayRecords");
const countdownWrapper = document.getElementById("countdownWrapper");
const circleProgress = document.getElementById("circleProgress");
const countdownText = document.getElementById("countdownText");

window.userId = "";
window.userName = "";
window.allowRemote = false;
window.clockType = "一般";
window.userReady = false;
let isClocking = false;
let recordsRequestId = 0;

function pad2(num) {
    return String(num).padStart(2, "0");
}

function updateClock() {
    const now = new Date();
    document.getElementById("timeHour").textContent = pad2(now.getHours());
    document.getElementById("timeMin").textContent = pad2(now.getMinutes());
    document.getElementById("timeSec").textContent = pad2(now.getSeconds());
    headerDate.textContent = now.toLocaleDateString("zh-TW", { year: "numeric", month: "long", day: "numeric", weekday: "short" });
}

updateClock();
setInterval(updateClock, 1000);

function showAlert(options) {
    return Swal.fire({
        customClass: { popup: "custom-swal-popup" },
        ...options
    });
}

function setButtonsLock(locked, startText = "上班", endText = "下班") {
    btnStart.disabled = locked;
    btnEnd.disabled = locked;
    btnStart.textContent = startText;
    btnEnd.textContent = endText;
    window.userReady = !locked;
}

async function fetchWithTimeout(url, options = {}, timeout = 10000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(url, { ...options, signal: controller.signal, cache: "no-store" });
        return response;
    } finally {
        clearTimeout(timer);
    }
}

async function fetchJSON(url, options = {}, timeout = 10000) {
    const response = await fetchWithTimeout(url, options, timeout);
    if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
    }
    const text = await response.text();
    if (!text) {
        throw new Error("伺服器沒有回傳資料");
    }
    try {
        return JSON.parse(text);
    } catch (err) {
        console.error("JSON parse error:", text);
        throw new Error("伺服器回傳格式錯誤");
    }
}

async function preloadIP() {
    const cache = sessionStorage.getItem("myIP");
    if (cache) return cache;
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000);
        const response = await fetch("https://api.ipify.org?format=json", { signal: controller.signal, cache: "no-store" });
        clearTimeout(timeoutId);
        if (!response.ok) return "";
        const data = await response.json();
        const ip = String(data.ip || "").trim();
        if (ip) {
            sessionStorage.setItem("myIP", ip);
        }
        return ip;
    } catch (err) {
        console.warn("IP 取得失敗", err);
        return "";
    }
}

function loadUserFromCache() {
    try {
        const cachedUserId = localStorage.getItem("cached_userId");
        const cachedUserName = localStorage.getItem("cached_userName");
        const cachedPictureUrl = localStorage.getItem("cached_pictureUrl");
        if (cachedUserId) {
            window.userId = cachedUserId;
            window.userName = cachedUserName || "使用者";
            userInfo.textContent = `${window.userName} 您好`;
            if (cachedPictureUrl) {
                userAvatar.innerHTML = `<img src="${cachedPictureUrl}" alt="avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
            } else {
                userAvatar.textContent = window.userName.charAt(0);
            }
            if (MANAGERS.includes(window.userId)) {
                btnApprove.style.display = "block";
            }
        }
        const cachedRecords = sessionStorage.getItem("cached_today_records");
        if (cachedRecords) {
            try {
                renderRecords(JSON.parse(cachedRecords));
            } catch (err) {
                console.warn("快取紀錄解析失敗", err);
            }
        }
    } catch (err) {
        console.warn("讀取 local cache 失敗", err);
    }
}

async function initUser() {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
        liff.login();
        throw new Error("LIFF_LOGIN_REQUIRED");
    }
    const profile = await liff.getProfile();
    window.userId = profile.userId;
    window.userName = profile.displayName || "使用者";
    userInfo.textContent = `${window.userName} 您好`;
    if (profile.pictureUrl) {
        userAvatar.innerHTML = `<img src="${profile.pictureUrl}" alt="avatar" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
        localStorage.setItem("cached_pictureUrl", profile.pictureUrl);
    } else {
        userAvatar.textContent = window.userName.charAt(0);
    }
    localStorage.setItem("cached_userId", window.userId);
    localStorage.setItem("cached_userName", window.userName);
    btnApprove.style.display = MANAGERS.includes(window.userId) ? "block" : "none";
}

async function updateStatus() {
    const ip = await preloadIP();
    const isCompany = COMPANY_IPS.includes(ip);
    if (isCompany) {
        window.allowRemote = false;
        statusInfo.textContent = "有效打卡區";
        statusInfo.style.background = "#2ecc71";
        setButtonsLock(false, "上班", "下班");
        return;
    }
    if (!window.userId) {
        statusInfo.textContent = "等待使用者資訊";
        statusInfo.style.background = "#95a5a6";
        setButtonsLock(true, "上班", "下班");
        return;
    }
    try {
        const url = `${API_ENDPOINT}?action=checkRemote&userId=${encodeURIComponent(window.userId)}`;
        const remoteData = await fetchJSON(url, {}, 8000);
        window.allowRemote = remoteData.allowed === true;
        window.clockType = remoteData.clockType || "一般";
        if (window.allowRemote) {
            statusInfo.textContent = "有效打卡區(異地)";
            statusInfo.style.background = "#2ecc71";
            setButtonsLock(false, "上班", "下班");
        } else {
            statusInfo.textContent = "無效打卡區";
            statusInfo.style.background = "#e74c3c";
            setButtonsLock(true, "上班", "下班");
        }
    } catch (err) {
        console.error("查詢異地權限失敗:", err);
        statusInfo.textContent = "無法確認打卡權限";
        statusInfo.style.background = "#e67e22";
        setButtonsLock(true, "上班", "下班");
    }
}

function getGeoLocation() {
    return new Promise(resolve => {
        if (!navigator.geolocation) {
            resolve({ lat: "", lng: "" });
            return;
        }
        navigator.geolocation.getCurrentPosition(
            position => {
                resolve({ lat: position.coords.latitude, lng: position.coords.longitude });
            },
            error => {
                console.warn("GPS 取得失敗:", error);
                resolve({ lat: "", lng: "" });
            },
            { timeout: 5000, maximumAge: 30000, enableHighAccuracy: true }
        );
    });
}

function startLoading(status, isMakeup = false) {
    countdownWrapper.classList.add("show");
    countdownWrapper.setAttribute("aria-hidden", "false");
    countdownText.textContent = isMakeup ? "補打卡中..." : `${status}打卡中...`;
    const radius = 50;
    const circumference = 2 * Math.PI * radius;
    circleProgress.style.strokeDasharray = circumference;
    circleProgress.style.strokeDashoffset = circumference;
    const colors = { "上班": "#3498db", "下班": "#2ecc71", "補打卡": "#f39c12" };
    circleProgress.style.stroke = isMakeup ? colors["補打卡"] : (colors[status] || colors["上班"]);
    circleProgress.style.transition = "stroke-dashoffset 0.8s linear";
    requestAnimationFrame(() => {
        circleProgress.style.strokeDashoffset = circumference * 0.15;
    });
}

function stopLoading() {
    countdownWrapper.classList.remove("show");
    countdownWrapper.setAttribute("aria-hidden", "true");
    circleProgress.style.strokeDashoffset = 0;
}

async function sendSelfMessage(record) {
    try {
        if (typeof liff === "undefined" || !liff.isInClient()) return;
        const headerColor = record.status === "下班" ? "#2ecc71" : "#3498db";
        await liff.sendMessages([{
            type: "flex",
            altText: `【打卡通知】${record.status}成功`,
            contents: {
                type: "bubble",
                header: {
                    type: "box",
                    layout: "vertical",
                    contents: [{ type: "text", text: `${record.userName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
                    backgroundColor: headerColor,
                    paddingAll: "12px"
                },
                body: {
                    type: "box",
                    layout: "vertical",
                    spacing: "md",
                    contents: [
                        { type: "text", text: `狀態：${record.status}`, size: "md" },
                        { type: "text", text: `時間：${record.date} ${record.time}`, size: "md" },
                        { type: "text", text: `網路：${record.netType}`, size: "md" }
                    ]
                }
            }
        }]);
    } catch (err) {
        console.warn("LINE Flex Message 發送失敗:", err);
    }
}

async function submitClock(status, customDate = "", customTime = "", isMakeup = false) {
    const payload = {
        userId: window.userId,
        displayName: window.userName,
        status,
        ip: await preloadIP(),
        lat: "",
        lng: "",
        customDate,
        customTime,
        isMakeup
    };
    if (!isMakeup && window.allowRemote && !COMPANY_IPS.includes(payload.ip)) {
        const geo = await getGeoLocation();
        payload.lat = geo.lat;
        payload.lng = geo.lng;
    }
    return await fetchJSON(API_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
    }, 15000);
}

async function performClockIn(status, customDate = "", customTime = "", isMakeup = false) {
    if (isClocking) return;
    if (!isMakeup && !window.userReady) {
        await showAlert({
            icon: "warning",
            title: "目前無法打卡",
            html: "<span style='color:#e67e22'>目前為無效打卡區，無法打卡。</span>",
            confirmButtonText: "確定"
        });
        return;
    }
    if (!window.userId) {
        await showAlert({
            icon: "error",
            title: "使用者資訊尚未完成",
            text: "請稍候重新載入頁面。",
            confirmButtonText: "確定"
        });
        return;
    }
    isClocking = true;
    setButtonsLock(true, "處理中...", "處理中...");
    startLoading(status, isMakeup);
    let apiData = null;
    try {
        apiData = await submitClock(status, customDate, customTime, isMakeup);
        if (apiData && apiData.ok === true) {
            stopLoading();
            isClocking = false;
            await updateStatus();
            await showAlert({
                icon: "success",
                title: isMakeup ? "🎉 補打卡成功！" : "🎉 打卡成功！",
                html: `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${escapeHTML(apiData.date || "")} ${escapeHTML(apiData.time || "")}</span></div>`,
                showConfirmButton: false,
                timer: 1800,
                timerProgressBar: true,
                backdrop: "rgba(0,0,0,0.5)"
            });
            updateTodayRecords(false);
            sendSelfMessage({
                userName: window.userName,
                status,
                date: apiData.date,
                time: apiData.time,
                netType: window.allowRemote ? "異地打卡(GPS)" : "公司網路"
            }).catch(err => {
                console.warn("背景 Flex Message 失敗:", err);
            });
            return;
        }
        stopLoading();
        isClocking = false;
        await updateStatus();
        await showAlert({
            icon: "warning",
            title: "打卡提示",
            html: `<span style="color:#c0392b;font-weight:bold;">${escapeHTML(apiData?.message || "打卡失敗")}</span>`,
            confirmButtonText: "確定"
        });
        updateTodayRecords(false);
    } catch (err) {
        console.error("performClockIn error:", err);
        stopLoading();
        isClocking = false;
        await updateStatus();
        let errorMessage = "網路連線異常，請稍後再試。";
        if (err && err.name === "AbortError") {
            errorMessage = "伺服器回應時間過長，請至下方「今日打卡紀錄」確認是否已成功。";
        } else if (err && err.message) {
            errorMessage = "打卡請求失敗，請至下方「今日打卡紀錄」確認是否已成功。";
        }
        await showAlert({
            icon: "error",
            title: "打卡連線異常",
            html: `<div style="color:#c0392b;line-height:1.7;">${escapeHTML(errorMessage)}</div>`,
            confirmButtonText: "確定"
        });
        updateTodayRecords(false);
    }
}

function escapeHTML(value) {
    return String(value ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function fixTimeFormat(value) {
    if (value === null || value === undefined || value === "") {
        return "00:00:00";
    }
    if (typeof value === "string" && value.includes(":") && !value.includes("T")) {
        const parts = value.split(":");
        while (parts.length < 3) {
            parts.push("00");
        }
        return parts.slice(0, 3).map(x => String(x).padStart(2, "0")).join(":");
    }
    if (typeof value === "string" && value.includes("T")) {
        const d = new Date(value);
        if (!isNaN(d.getTime())) {
            return d.toLocaleTimeString("zh-TW", { hour12: false });
        }
    }
    return String(value);
}

function getTodayString() {
    const now = new Date();
    return [now.getFullYear(), pad2(now.getMonth() + 1), pad2(now.getDate())].join("/");
}

function renderRecords(data) {
    if (!Array.isArray(data) || data.length === 0) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }
    const html = data.map(record => {
        const status = escapeHTML(record.status);
        const time = fixTimeFormat(record.time);
        const ip = String(record.ip || "");
        const isCompany = COMPANY_IPS.includes(ip);
        const networkLabel = isCompany ? "公司網路" : "異地打卡";
        const networkColor = isCompany ? "#7f8c8d" : "#e67e22";
        const color = record.status === "下班" ? "#2ecc71" : "#3498db";
        const makeupBadge = record.isMakeup ? `<span class="badge-makeup">待審核</span>` : "";
        return `
            <div class="record-item" style="border-left-color:${color};">
                <div class="record-info">
                    <div class="record-status">${status} ${makeupBadge}</div>
                    <div class="record-details" style="color:${networkColor};">${networkLabel}</div>
                </div>
                <div class="record-time" style="color:${color};">${escapeHTML(time)}</div>
            </div>
        `;
    }).join("");
    todayRecords.innerHTML = html;
}

async function updateTodayRecords(showLoading = true) {
    if (!window.userId) return;
    const requestId = ++recordsRequestId;
    const cache = sessionStorage.getItem("cached_today_records");
    if (showLoading && !cache) {
        todayRecords.innerHTML = `<div class="records-empty">正在載入紀錄…</div>`;
    }
    try {
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(window.userId)}&date=${encodeURIComponent(getTodayString())}`;
        const data = await fetchJSON(url, {}, 10000);
        if (requestId !== recordsRequestId) return;
        if (Array.isArray(data)) {
            sessionStorage.setItem("cached_today_records", JSON.stringify(data));
            renderRecords(data);
        } else {
            throw new Error("紀錄資料格式錯誤");
        }
    } catch (err) {
        console.warn("今日紀錄讀取失敗:", err);
        if (!cache) {
            todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">今日打卡紀錄暫時無法取得</div>`;
        }
    }
}

btnStart.addEventListener("click", () => { performClockIn("上班"); });
btnEnd.addEventListener("click", () => { performClockIn("下班"); });
btnApprove.addEventListener("click", () => { window.location.href = APPROVE_URL; });

async function initializeApp() {
    statusInfo.textContent = "初始化中...";
    statusInfo.style.background = "#95a5a6";
    setButtonsLock(true, "同步中...", "同步中...");
    loadUserFromCache();
    try {
        await Promise.all([initUser(), preloadIP()]);
        await updateStatus();
        updateTodayRecords(false);
    } catch (err) {
        console.error("初始化失敗:", err);
        if (err && err.message === "LIFF_LOGIN_REQUIRED") return;
        statusInfo.textContent = "初始化失敗";
        statusInfo.style.background = "#e74c3c";
        setButtonsLock(true, "上班", "下班");
        if (window.userId) {
            updateStatus().catch(console.error);
        }
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeApp);
} else {
    initializeApp();
}
</script>
